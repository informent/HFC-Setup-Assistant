name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run calculation and persistence checks
        run: dotnet run --project tests/HfcSetupAssistant.Checks/HfcSetupAssistant.Checks.csproj -c Release -p:NuGetAudit=false
      - name: Build desktop application
        run: dotnet build src/HfcSetupAssistant.Desktop/HfcSetupAssistant.Desktop.csproj -c Release -p:UseSharedCompilation=false -p:NuGetAudit=false
      - name: Publish self-contained Windows app
        run: dotnet publish src/HfcSetupAssistant.Desktop/HfcSetupAssistant.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:NuGetAudit=false -o artifacts/win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: HFC-Setup-Assistant-win-x64
          path: artifacts/win-x64/HFC Setup Assistant.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: HFC-Setup-Assistant-win-x64
          path: artifacts/win-x64
      - name: Publish the single-file Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG "artifacts/win-x64/HFC Setup Assistant.exe" --repo $env:GITHUB_REPOSITORY --title "HFC Setup Assistant $env:RELEASE_TAG" --generate-notes
